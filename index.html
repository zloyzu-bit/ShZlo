<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="map-container">
    <!-- SVG будет здесь -->
    <svg viewBox="0 0 1110 1200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <!-- Подложка: ваше изображение -->
      <image href="map.png" width="1110" height="1200" />

      <!-- Интерактивные зоны (пока одна для примера) -->
      <g class="region" 
         data-title="ЗАВОДЫ" 
         data-desc="Здесь живут машины">
        <polygon points="844,884 858,491 909,421 1031,563 1018,890" fill="rgba(166, 137, 105, 0.4)" />
         </g>


      <g class="region" 
         data-title="СТАНЦИЯ" 
         data-desc="Сейчас поезда не ходят">
        <polygon points="857,481 823,430 853,418 867,457" fill="rgba(166, 137, 105, 0.4)" />
         </g>

      
      <g class="region" 
         data-title="КЛАДБИЩЕ" 
         data-desc="Здесь вас всегда ждут">
        <polygon polygon points="375,348 358,291 407,264 433,324 400,336"  fill="rgba(166, 137, 105, 0.6)" />
         </g>


      <g class="region" 
         data-title="БОЙНИ" 
         data-desc="Когда-то они были храмом, теперь здесь забивают быков">
        <polygon polygon points="299,223 186,71 263,45 352,50 395,117 359,186"  fill="rgba(129, 65, 60, 0.4)" />
         </g>


      <g class="region" 
         data-title="ТЕРМИТНИК" 
         data-desc="Огромное общежитие для работников Проекта Быков">
        <polygon points="266,196 201,226 90,173 86,106 181,83"  fill="rgba(129, 65, 60, 0.4)" />
         </g>


      <g class="region" 
         data-title="МНОГОГРАННИК" 
         data-desc="Башнядетей. Её устройство противоречит законам физики">
        <polygon points="844,884 858,491 909,421 1031,563 1018,890" fill="rgba(166, 137, 105, 0.4)" />
         </g>
</svg>

      </g>
    </svg>

    <!-- Всплывающая подсказка -->
    <div class="tooltip" id="tooltip">
  <h3 class="tooltip-title"></h3>
  <p class="tooltip-text"></p>
</div>

  <script src="script.js"></script>
</body>
</html>
