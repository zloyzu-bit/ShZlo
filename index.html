<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="map-container">
    <!-- SVG будет здесь -->
    <svg viewBox="0 0 1110 1200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <!-- Подложка: ваше изображение -->
      <image href="map.png" width="1110" height="1200" />

      <!-- Интерактивные зоны (пока одна для примера) -->
      <g class="region" 
         data-title="ЗАВОДЫ" 
         data-desc="Здесь живут машины">
        <polygon points="" fill="rgba(166, 137, 105, 0.4)" />
         </g>


      <g class="region" 
         data-title="СТАНЦИЯ" 
         data-desc="Сейчас поезда не ходят">
        <polygon points="" fill="rgba(166, 137, 105, 0.4)" />
         </g>

      
      <g class="region" 
         data-title="КЛАДБИЩЕ" 
         data-desc="Здесь вас всегда ждут">
        <polygon polygon points=""  fill="rgba(166, 137, 105, 0.6)" />
         </g>


      <g class="region" 
         data-title="БОЙНИ" 
         data-desc="Когда-то они были храмом, теперь здесь забивают быков">
        <polygon polygon points=""  fill="rgba(129, 65, 60, 0.4)" />
         </g>


      <g class="region" 
         data-title="ТЕРМИТНИК" 
         data-desc="Огромное общежитие для работников Проекта Быков">
        <polygon points=""  fill="rgba(129, 65, 60, 0.4)" />
         </g>
</svg>

      </g>
    </svg>

    <!-- Всплывающая подсказка -->
    <div class="tooltip" id="tooltip">
  <h3 class="tooltip-title"></h3>
  <p class="tooltip-text"></p>
</div>

  <script src="script.js"></script>
</body>
</html>
