<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <title>Интерактивная карта</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="map-container">
    <!-- SVG будет здесь -->
    <svg viewBox="0 0 1110 1200" preserveAspectRatio="xMidYMid meet" xmlns="http://www.w3.org/2000/svg">
      <!-- Подложка: ваше изображение -->
      <image href="map.png" width="1110" height="1200" />

      <!-- Интерактивные зоны (пока одна для примера) -->
      <g class="region" 
         data-title="ЗАВОДЫ" 
         data-desc="Здесь живут машины">
        <polygon points="844,884 858,491 909,421 1031,563 1018,890" fill="rgba(166, 137, 105, 0.4)" />
         </g>


      <g class="region" 
         data-title="СТАНЦИЯ"

        <polygon points="857,481 823,430 853,418 867,457" fill="rgba(166, 137, 105, 0.4)" />
         </g>

      
      <g class="region" 
         data-title="КЛАДБИЩЕ"

        <polygon polygon points="375,348 358,291 407,264 433,324 400,336"  fill="rgba(166, 137, 105, 0.6)" />

      <g class="region"

</svg>

      </g>
    </svg>

    <!-- Всплывающая подсказка -->
