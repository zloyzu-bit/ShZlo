<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Интерактивная карта</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="map-container">
    <!-- SVG будет здесь -->
    <svg viewBox="0 0 1510 1200" xmlns="http://www.w3.org/2000/svg">
      <!-- Подложка: ваше изображение -->
      <image href="map.png" width="1510" height="1200" />

      <!-- Интерактивные зоны (пока одна для примера) -->
      <g class="region" data-tooltip="Это зона А">
        <polygon points="100,100 200,80 250,150 180,200" fill="transparent" />
      </g>
    </svg>

    <!-- Всплывающая подсказка -->
    <div class="tooltip" id="tooltip"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
